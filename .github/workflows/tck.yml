name: Configurator TCK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out harness and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Run Configurator TCK
        run: ./run-tck.sh

      - name: Upload TCK reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: configurator-tck-reports
          path: build/tck-reports
          if-no-files-found: warn
